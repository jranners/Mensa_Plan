name: Update Supabase API Key

on:
  schedule:
    - cron: '*/30 6-16 * * 1-5'  # Alle 30 Minuten während der Geschäftszeiten (Mo-Fr, ca. 07:00-18:00 MEZ/MESZ)
    - cron: '0 0,12 * * *'       # Zweimal täglich als Fallback für den API-Key (täglich um 00:00 und 12:00 Uhr)
  workflow_dispatch:            # Ermöglicht manuellen Start im GitHub-Interface

concurrency:
  group: 'update-api-key'
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-key:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Key Scraper
        run: node scripts/update-key.js
        continue-on-error: true

      - name: Run Announcement Scraper
        run: node scripts/update-announcements.js
        continue-on-error: true

      - name: Run All-Time Stats Aggregator
        if: github.event.schedule == '0 0,12 * * *' || github.event_name == 'workflow_dispatch'
        run: node scripts/update-all-time-stats.mjs
        continue-on-error: true

      - name: Validate RPC Health
        run: node scripts/check-rpc.mjs

      - name: Synchronize Service Worker Cache Version
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            if ! git diff --name-only | grep -q "^sw.js$"; then
              echo "Data updates detected without SW version bump. Incrementing CACHE_NAME in sw.js..."
              node -e "
                const fs = require('fs');
                let sw = fs.readFileSync('sw.js', 'utf8');
                sw = sw.replace(/const CACHE_NAME = 'kstw-mensa-v(\d+)';/, (m, v) => \`const CACHE_NAME = 'kstw-mensa-v\${parseInt(v, 10) + 1}';\`);
                fs.writeFileSync('sw.js', sw);
              "
            fi
          fi

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/config.js data/announcements.json data/stats_all_time.json sw.js
          if ! git diff --cached --exit-code; then
            git commit -m "chore: auto-update Supabase credentials, announcements & all-time stats [skip ci]"
            git pull --rebase origin main || true
            git push
          else
            echo "No changes in credentials, announcements, or stats detected."
          fi
