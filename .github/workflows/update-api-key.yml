name: Update Supabase API Key

on:
  schedule:
    - cron: '*/5 8-18 * * 1-5'  # Alle 5 Minuten während der Geschäftszeiten (Mo-Fr, 8-18 Uhr)
    - cron: '0 0,12 * * *'       # Zweimal täglich als Fallback für den API-Key (täglich um 00:00 und 12:00 Uhr)
  workflow_dispatch:      # Ermöglicht manuellen Start im GitHub-Interface

permissions:
  contents: write

jobs:
  update-key:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Key Scraper
        run: node scripts/update-key.js

      - name: Run Announcement Scraper
        run: node scripts/update-announcements.js
        continue-on-error: true

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/config.js data/announcements.json
          if ! git diff --cached --exit-code; then
            git commit -m "chore: auto-update Supabase credentials & announcements [skip ci]"
            git push
          else
            echo "No changes in credentials or announcements detected."
          fi
